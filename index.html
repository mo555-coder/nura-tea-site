<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090b"><title>MOMO HYBRID V3.3</title><style>
:root{--bg:#09090b;--p:#141418;--p2:#1b1b20;--line:#303038;--t:#f7f7f8;--m:#9696a0;--lime:#d9ff57;--mint:#7cebd0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,Inter,system-ui,sans-serif}.app{max-width:620px;margin:auto;padding:16px 16px 105px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:28px;font-weight:950;letter-spacing:-1.4px}.brand em{font-style:normal;color:var(--lime)}.pill,.tag{border:1px solid var(--line);border-radius:999px;padding:7px 10px;color:var(--m);font-size:11px}.switcher{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.switcher button,.weeks button{border:1px solid var(--line);background:#111114;color:var(--m);border-radius:14px;padding:11px;font-weight:850}.switcher button.on,.weeks button.on{background:var(--lime);color:#09090b}.view{display:none}.view.on{display:block}.hero,.card{background:var(--p);border:1px solid var(--line);border-radius:22px;padding:16px;margin-top:12px}.hero{padding:22px;background:linear-gradient(145deg,#1b1b20,#101013)}.ey{font-size:10px;letter-spacing:1.5px;font-weight:950;color:var(--lime)}h1{margin:8px 0;font-size:34px;letter-spacing:-1.7px}h2{font-size:20px;margin:24px 0 8px}.muted{color:var(--m);font-size:12px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}.name{font-weight:850}.meta{font-size:11px;color:var(--m);margin-top:3px}.weight{display:flex;align-items:center;gap:5px}.weight input,.set input,.form input,.form select{background:#0e0e11;border:1px solid var(--line);border-radius:10px;color:#fff;padding:9px;font:inherit}.weight input{width:72px;text-align:center;font-weight:850}.sets{margin-top:8px}.set{display:grid;grid-template-columns:32px 1fr 1fr 38px;gap:7px;margin-top:7px;align-items:center}.set input{text-align:center;width:100%;min-width:0}.check{height:34px;border-radius:10px;border:1px solid var(--line);background:#0e0e11;color:#777}.check.on{background:var(--lime);color:#09090b}.note{margin-top:10px;padding:11px;border-radius:14px;background:#0e0e11;border:1px solid var(--line);font-size:12px;color:var(--m);line-height:1.4}.note b{color:var(--lime)}.btn{width:100%;border:0;border-radius:15px;padding:13px;margin-top:10px;background:var(--lime);color:#09090b;font-weight:900}.btn.alt{background:#1a1a20;color:#fff;border:1px solid var(--line)}.weeks{display:flex;gap:7px;overflow:auto}.weeks button{white-space:nowrap;padding:9px 11px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.stat{background:#111114;border:1px solid var(--line);border-radius:16px;padding:12px}.stat b{display:block;font-size:21px}.tabs{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(590px,calc(100% - 18px));display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:#151519ee;border:1px solid var(--line);padding:7px;border-radius:20px;z-index:20}.tabs button{border:0;background:transparent;color:#85858e;padding:9px 2px;border-radius:12px;font-size:10px;font-weight:850}.tabs button.on{background:#29292f;color:#fff}.tabs b{display:block;font-size:15px}.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}.timeline .row{align-items:flex-start}.good{color:var(--mint)}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#eaffcf;color:#10120d;padding:9px 13px;border-radius:999px;font-weight:900;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:30}.toast.on{opacity:1}
</style></head><body><div class="app"><header class="top"><div class="brand">MOMO <em>HYBRID</em></div><div class="pill" id="weekPill">S1/8</div></header><div class="switcher"><button id="momoBtn">Momo</button><button id="mickyBtn">⚡ Micky</button></div>
<section class="view on" id="today"><div class="hero"><div class="ey">AUJOURD'HUI</div><h1 id="todayTitle"></h1><div class="muted" id="todaySub"></div><div class="stats"><div class="stat"><b id="sessions">0</b><span class="muted">séances</span></div><div class="stat"><b id="runStep">1/8</b><span class="muted">palier run</span></div></div></div><h2>Tu en étais là</h2><div class="card" id="resume"></div><h2>Séance du jour</h2><div id="todayBox"></div></section>
<section class="view" id="program"><h2>Programme muscu</h2><div class="weeks" id="weeks"></div><div id="programBox"></div></section>
<section class="view" id="cardio"><h2>Course + JJB</h2><div class="card"><div class="ey">PROCHAIN RUN</div><h1 id="runTarget"></h1><div class="muted" id="runLast"></div></div><div class="card"><b>Enregistrer un cardio</b><div class="form" style="margin-top:10px"><select id="ctype"><option>Course facile</option><option>Intervalles JJB</option><option>JJB réel</option><option>Marche</option></select><input id="cmin" placeholder="minutes" inputmode="numeric"><input id="ckm" placeholder="km" inputmode="decimal"><input id="chr" placeholder="FC moy." inputmode="numeric"></div><button class="btn" id="saveCardio">Enregistrer</button></div><div class="card timeline" id="cardioHist"></div></section>
<section class="view" id="progress"><h2>Progrès</h2><div class="card"><b>Charges mémorisées</b><div id="loads"></div></div><div class="card timeline"><b>Historique</b><div id="history"></div></div></section>
<section class="view" id="profile"><h2>Profil</h2><div class="card"><b>Polar</b><p class="muted">Connexion réelle à venir via OAuth officiel. Aucune fausse synchronisation.</p></div><div class="card"><b>Données</b><button class="btn alt" id="reset">Réinitialiser les données locales</button></div></section></div>
<nav class="tabs"><button class="on" data-tab="today"><b>⌂</b>Aujourd'hui</button><button data-tab="program"><b>◫</b>Muscu</button><button data-tab="cardio"><b>♥</b>Cardio</button><button data-tab="progress"><b>↗</b>Progrès</button><button data-tab="profile"><b>●</b>Profil</button></nav><div class="toast" id="toast"></div>
<script>
const P={A:{title:'Haut du corps force + abdos',day:'LUN',ex:[['Développé couché barre','4×6–8','52.5',2.5],['Rowing horizontal lourd','4×6–8','',2.5],['Développé épaules haltères','3×10–12','',2.5],['Tirage vertical','3×10–12','',2.5],['Face pull','3×12–15','',2.5],['Crunch poulie','3×10–12','',2.5]]},B:{title:'Jambes force + abdos',day:'MER',ex:[['Presse / hack squat','4×6–8','',5],['Soulevé de terre roumain','3×6–8','',5],['Fente / presse unilatérale','3×10–12','',2.5],['Mollets','4×12–15','',5],['Ab-wheel','3×8–12','',0]]},C:{title:'Haut du corps volume + abdos',day:'VEN',ex:[['Développé incliné haltères','4×10–12','',2.5],['Rowing haltère unilatéral','4×10–12','',2.5],['Développé épaules assis','3×10–12','',2.5],['Tirage poulie large','3×10–12','',2.5],['Biceps + triceps','3×10–12','',2.5],['Relevés genoux suspendu','3×10–12','',0]]}};
const RUN=[30,35,40,35,50,55,60,65],K='momoHybridStable';let S=Object.assign({week:1,person:'momo',loads:{},drafts:{},workouts:[],cardio:[],runStep:1},JSON.parse(localStorage.getItem(K)||'{}'));S.loads=S.loads||{};S.drafts=S.drafts||{};S.workouts=S.workouts||[];S.cardio=S.cardio||[];
const save=()=>localStorage.setItem(K,JSON.stringify(S)),toast=t=>{let e=document.getElementById('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1400)},key=(c,i)=>`${S.person}-${c}-${i}`,top=txt=>{let m=txt.match(/(\d+)[–-](\d+)/);return m?+m[2]:null},sets=txt=>+(txt.match(/^(\d+)/)||[,3])[1],fmt=v=>String(v).replace('.',',');
function day(){let d=new Date().getDay();if(d===1)return['A','muscu'];if(d===2)return['run','cardio'];if(d===3)return['B','muscu'];if(d===5)return['C','muscu'];if(d===6)return['combat','cardio'];return['rest','rest']}
function load(c,i,e){let v=S.loads[key(c,i)]?.current;return v??(e[2]?+e[2]:'')}
function weightInput(c,i,e){let v=load(c,i,e);return `<div class="weight"><input data-weight="1" data-c="${c}" data-i="${i}" value="${v!==''?v:''}" inputmode="decimal" placeholder="kg"><span class="muted">kg</span></div>`}
function exRows(c,interactive=false){return P[c].ex.map((e,i)=>{let html='',n=sets(e[1]),k=key(c,i),d=S.drafts[k]||{},v=load(c,i,e);if(interactive)for(let s=0;s<n;s++){let x=(d.sets||[])[s]||{};html+=`<div class="set"><span class="muted">S${s+1}</span><input data-set="${k}" data-n="${s}" data-f="kg" value="${x.kg??(v!==''?v:'')}" placeholder="kg"><input data-set="${k}" data-n="${s}" data-f="reps" value="${x.reps??''}" placeholder="reps"><button class="check ${x.done?'on':''}" data-check="${k}" data-n="${s}">${x.done?'✓':'○'}</button></div>`}return `<div class="row"><div style="flex:1"><div class="name">${e[0]}</div><div class="meta">${e[1]}${S.person==='power'&&i===0?' · Micky: vitesse/explosivité':''}</div>${interactive?`<div class="sets">${html}</div>`:''}</div>${weightInput(c,i,e)}</div>`}).join('')}
function card(c,interactive=false){let p=P[c],power=S.person==='power'?`<div class="note"><b>⚡ Micky :</b> sur le premier mouvement, 2×3 explosif léger puis 2 séries normales. Ça remplace du volume, ça ne rallonge pas la séance.</div>`:'';return `<div class="card"><div class="row"><div><div class="name">${p.title}</div><div class="meta">${p.day}</div></div><span class="tag">${S.person==='power'?'PUISSANCE':'HYBRIDE'}</span></div>${power}${exRows(c,interactive)}${interactive?'<button class="btn" id="finish">Terminer & enregistrer</button>':''}</div>`}
function bindWeights(){document.querySelectorAll('[data-weight]').forEach(inp=>inp.onchange=()=>{let c=inp.dataset.c,i=+inp.dataset.i,e=P[c].ex[i],kg=parseFloat(inp.value.replace(',','.'));if(!Number.isFinite(kg))return;let k=key(c,i),prev=S.loads[k]?.current??(e[2]?+e[2]:0);if(prev&&kg>prev){let ok=confirm(`Tu passes de ${fmt(prev)} à ${fmt(kg)} kg sur ${e[0]}.\n\nSi tu te sens bien, sans douleur et avec 1–2 reps en réserve, OK pour tester. Valider cette nouvelle charge ?`);if(!ok){inp.value=prev;toast('Ancienne charge conservée');return}}S.loads[k]={current:kg,date:new Date().toISOString()};save();toast(`${e[0]} : ${fmt(kg)} kg mémorisé`);renderProgress()})}
function bindSets(){document.querySelectorAll('[data-set]').forEach(inp=>inp.oninput=()=>{let k=inp.dataset.set,n=+inp.dataset.n,f=inp.dataset.f;S.drafts[k]=S.drafts[k]||{sets:[]};S.drafts[k].sets[n]=S.drafts[k].sets[n]||{};S.drafts[k].sets[n][f]=inp.value;save()});document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{let k=b.dataset.check,n=+b.dataset.n;S.drafts[k]=S.drafts[k]||{sets:[]};S.drafts[k].sets[n]=S.drafts[k].sets[n]||{};S.drafts[k].sets[n].done=!S.drafts[k].sets[n].done;save();renderToday()});let f=document.getElementById('finish');if(f)f.onclick=finish}
function finish(){let [c,t]=day();if(t!=='muscu')return;let volume=0;P[c].ex.forEach((e,i)=>{let k=key(c,i),arr=(S.drafts[k]?.sets||[]).filter(x=>x.done),need=sets(e[1]);arr.forEach(x=>volume+=(+x.kg||0)*(+x.reps||0));if(arr.length<need)return;let kg=Math.min(...arr.map(x=>+x.kg||0)),mx=top(e[1]),prev=S.loads[k]?.current??(e[2]?+e[2]:0),next=Math.max(prev,kg);if(mx&&e[3]>0&&arr.every(x=>(+x.reps||0)>=mx))next=kg+e[3];S.loads[k]={current:next,date:new Date().toISOString()}});S.workouts.unshift({date:new Date().toISOString(),code:c,person:S.person,volume});Object.keys(S.drafts).filter(k=>k.startsWith(S.person+'-'+c+'-')).forEach(k=>delete S.drafts[k]);save();toast('Séance enregistrée ✓');renderAll()}
function renderToday(){let [c,t]=day(),box=document.getElementById('todayBox'),title=document.getElementById('todayTitle'),sub=document.getElementById('todaySub');if(t==='muscu'){title.textContent=P[c].title;sub.textContent=S.person==='power'?'Micky · puissance sans volume en plus':'Momo · force + muscle';box.innerHTML=card(c,true);bindSets();bindWeights()}else if(c==='run'){title.textContent='Course facile';sub.textContent=`${RUN[S.runStep-1]} min · allure conversationnelle`;box.innerHTML=`<div class="card"><b>${RUN[S.runStep-1]} min facile</b><div class="note">Enregistre ensuite la séance dans Cardio. L’app retient le palier suivant.</div></div>`}else if(c==='combat'){title.textContent='Cardio spécifique JJB';sub.textContent='Intervalles contrôlés';box.innerHTML='<div class="card">3–5 rounds selon ta semaine. Le but est de répéter un effort dur puis récupérer vite.</div>'}else{title.textContent='Récupération active';sub.textContent='Marche · mobilité · sommeil';box.innerHTML='<div class="card">Pas de séance dure aujourd’hui.</div>'}let last=S.workouts[0]||S.cardio[0];document.getElementById('resume').innerHTML=last?`<b>Dernière séance enregistrée</b><div class="muted">${new Date(last.date).toLocaleDateString('fr-FR')}</div>`:'<b>Commence ici</b><div class="muted">Tes charges et tes runs seront mémorisés automatiquement.</div>';document.getElementById('sessions').textContent=S.workouts.length+S.cardio.length;document.getElementById('runStep').textContent=S.runStep+'/8';document.getElementById('weekPill').textContent='S'+S.week+'/8'}
function renderProgram(){document.getElementById('weeks').innerHTML=RUN.map((_,i)=>`<button class="${S.week===i+1?'on':''}" data-w="${i+1}">S${i+1}</button>`).join('');document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{S.week=+b.dataset.w;save();renderProgram()});document.getElementById('programBox').innerHTML=['A','B','C'].map(c=>card(c,false)).join('');bindWeights()}
function renderCardio(){document.getElementById('runTarget').textContent=RUN[S.runStep-1]+' min';let last=S.cardio.find(x=>x.type==='Course facile');document.getElementById('runLast').textContent=last?`Tu en étais à ${last.min} min${last.km?' · '+last.km+' km':''}`:'Aucune course enregistrée';document.getElementById('cardioHist').innerHTML=S.cardio.length?S.cardio.slice(0,8).map(x=>`<div class="row"><div><b>${x.type}</b><div class="muted">${new Date(x.date).toLocaleDateString('fr-FR')}</div></div><div>${x.min} min${x.km?' · '+x.km+' km':''}</div></div>`).join(''):'<div class="muted">Aucun cardio enregistré.</div>'}
function renderProgress(){let rows=[];['A','B','C'].forEach(c=>P[c].ex.forEach((e,i)=>{let v=S.loads['momo-'+c+'-'+i]?.current;if(v)rows.push(`<div class="row"><div><b>${e[0]}</b><div class="muted">${e[1]}</div></div><div class="good"><b>${fmt(v)} kg</b></div></div>`)}));document.getElementById('loads').innerHTML=rows.length?rows.join(''):'<div class="muted" style="margin-top:10px">Entre tes charges dans Muscu.</div>';document.getElementById('history').innerHTML=S.workouts.length?S.workouts.slice(0,8).map(x=>`<div class="row"><div><b>${P[x.code]?.title||x.code}</b><div class="muted">${new Date(x.date).toLocaleDateString('fr-FR')}</div></div><div>${Math.round(x.volume||0)} kg</div></div>`).join(''):'<div class="muted">Aucune séance enregistrée.</div>'}
function renderAll(){document.getElementById('momoBtn').classList.toggle('on',S.person!=='power');document.getElementById('mickyBtn').classList.toggle('on',S.person==='power');renderToday();renderProgram();renderCardio();renderProgress()}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));document.getElementById(b.dataset.tab).classList.add('on')}));document.getElementById('momoBtn').onclick=()=>{S.person='momo';save();renderAll()};document.getElementById('mickyBtn').onclick=()=>{S.person='power';save();renderAll()};document.getElementById('saveCardio').onclick=()=>{let type=document.getElementById('ctype').value,min=+document.getElementById('cmin').value,km=document.getElementById('ckm').value,hr=document.getElementById('chr').value;if(!min)return toast('Ajoute la durée');if(type==='Course facile'&&min>=RUN[S.runStep-1]&&S.runStep<8)S.runStep++;S.cardio.unshift({date:new Date().toISOString(),type,min,km,hr});save();renderAll();toast('Cardio enregistré ✓')};document.getElementById('reset').onclick=()=>{if(confirm('Effacer toutes les données locales ?')){localStorage.removeItem(K);location.reload()}};renderAll();
</script></body></html>
