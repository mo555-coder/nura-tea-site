<title>GROUND ZERO</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#0A0B0D;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
#splash{position:fixed;inset:0;display:grid;place-items:center;background:#0A0B0D;color:#F4F5F6;z-index:2;transition:opacity .25s ease}
#splash.hide{opacity:0;pointer-events:none}
.mark{display:flex;flex-direction:column;align-items:center;gap:14px;font-weight:800;letter-spacing:-.4px}.logo{width:72px;height:72px;border-radius:18px;background:#17181B;display:grid;place-items:center;color:#C9F73D;font-size:30px;font-weight:900}.sub{font-size:12px;color:#9498A0;font-weight:600}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0A0B0D}
</style>
</head>
<body>
<div id="splash"><div class="mark"><div class="logo">GZ</div><div>GROUND ZERO</div><div class="sub">Hybrid training</div></div></div>
<iframe id="app" src="./?v=44" title="GROUND ZERO"></iframe>
<script>
const frame=document.getElementById('app'),splash=document.getElementById('splash');
frame.addEventListener('load',()=>setTimeout(()=>splash.classList.add('hide'),180));
</script>
</body>
